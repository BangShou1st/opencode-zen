name: publish

# Publishes com.sharedlibs:opencode-zen-spring-boot-* to GitHub Packages for this repository.
# Push a version tag (e.g. `git tag v1.3.0 && git push --tags`) and the package is published.
# No secret has to be stored: GITHUB_TOKEN is sufficient inside the library repository itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify
        # `bash ./gradlew` avoids the executable bit that a Windows checkout does not carry.
        # The library ships no tests: they live in the consumer-tests project,
        # which resolves the published coordinate and exercises the artifact.
        run: bash ./gradlew build --no-daemon
      - name: Publish
        run: bash ./gradlew publish --no-daemon
        env:
          # github.repository is <OWNER>/<REPO>, which is exactly the GitHub Packages coordinate.
          ZEN_MAVEN_REPO_URL: https://maven.pkg.github.com/${{ github.repository }}
          ZEN_MAVEN_USER: ${{ github.actor }}
          ZEN_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
