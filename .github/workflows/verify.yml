name: verify-java
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the shared library
        # This library ships no tests: it is a lean artifact other projects
        # depend on, and its correctness is checked from the outside by the
        # opencode-zen-consumer-tests project, which resolves the published
        # coordinate and exercises the artifact the way a consumer does.
        run: bash ./gradlew build --no-daemon
